services:
  rallly:
    build:
      context: ./rallly
      dockerfile: ./apps/web/Dockerfile
      args:
        - SELF_HOSTED=true
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      SECRET_PASSWORD: ${SECRET_PASSWORD}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/rallly
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      # Envoi des e-mails vers Mailpit
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      # Connexion OIDC via Authentik
      OIDC_NAME: Authentik
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      # true : seuls les utilisateurs connectés via OIDC peuvent voter
      REQUIRE_OIDC_TO_VOTE: ${REQUIRE_OIDC_TO_VOTE:-true}
    # authentik.localhost doit être joignable depuis le conteneur ET le navigateur (*.localhost se résout en loopback)
    extra_hosts:
      - "authentik.localhost:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rallly
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Faux serveur mail : capte tous les e-mails de la stack
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"    # interface web pour lire les e-mails

  # Fournisseur d'identité (IdP) OIDC
  authentik-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik
    volumes:
      - authentik-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 5s
      timeout: 5s
      retries: 5

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.10.1
    restart: unless-stopped
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    ports:
      - "9000:9000"    # interface web Authentik
    depends_on:
      authentik-db:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.10.1
    restart: unless-stopped
    command: worker
    environment: *authentik-env
    depends_on:
      authentik-db:
        condition: service_healthy

volumes:
  db-data:
  authentik-db-data:
