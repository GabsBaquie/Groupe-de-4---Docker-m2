services:
  rallly:
    image: lukevella/rallly:4
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      SECRET_PASSWORD: ${SECRET_PASSWORD}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/rallly
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      # Envoi des e-mails vers Mailpit
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rallly
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Faux serveur mail : capte tous les e-mails de la stack
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"    # interface web pour lire les e-mails

volumes:
  db-data:
